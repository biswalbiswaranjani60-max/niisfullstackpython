<html>
<head>
    <title>Details Tag Example</title>

<body>

<h2>Click to see more information</h2>

<details>
    <summary>What is HTML?</summary>
    <p>HTML stands for HyperText Markup Language. It is used to create web pages.</p>
</details>


<details>
    <summary>What is CSS?</summary>
    CSS is used to style and design web pages.
</details>


<details>
    <summary>What is JavaScript?</summary>
    JavaScript is used to make web pages interactive.
</details>

</body>
</html>
