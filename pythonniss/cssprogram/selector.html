<!DOCTYPE html>
<html>
<head>
<style>

/* Universal Selector */
* {
  margin: 0;
  padding: 0;
}

/* Element Selector */
p {
  color: red;
}

/* Class Selector */
.box {
  background-color: yellow;
}

/* ID Selector */
#title {
  color: green;
}

</style>
</head>

<body>

<h1 id="title">This is Heading</h1>

<p>This is normal paragraph</p>

<p class="box">This is class example</p>

<div class="box">This is div with class</div>

<span>Span text</span>

</body>
</html>
